name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        django: ["5.1", "5.2", "6.1"]
        include:
          - python: "3.14"
            django: "6.1"
          # Django 5.1.4: the exact version of a downstream project.
          - python: "3.12"
            django: "5.1.4"
          # Django 4.2: the minimum version.
          - python: "3.12"
            django: "4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Pin Django first, so that installing the package keeps that version.
      - run: pip install "Django~=${{ matrix.django }}.0"
      - run: pip install -e .
      - run: python runtests.py -v 2

  # Python 3.8: temporary support, with Django 4.2 only.
  # setup-python has no 3.8 on ubuntu-latest, hence the container.
  # setuptools >= 77 (pyproject.toml) does not run on 3.8, so the package is
  # not installed: runtests.py imports it from the repository root.
  test-py38:
    runs-on: ubuntu-latest
    container: python:3.8-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install "Django~=4.2.0"
      - run: python runtests.py -v 2
