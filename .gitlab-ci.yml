stages:
  - test

test:
  stage: test
  image: python:${PYTHON}-slim
  parallel:
    matrix:
      # Django 5.1: version used by ccshop; 5.2: LTS; 6.1: latest.
      - PYTHON: ["3.12", "3.13"]
        DJANGO: ["5.1", "5.2", "6.1"]
      - PYTHON: ["3.14"]
        DJANGO: ["6.1"]
      # Django 5.1.4: the exact version ccshop runs on.
      - PYTHON: ["3.12"]
        DJANGO: ["5.1.4"]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: pip-$PYTHON
    paths:
      - .pip-cache/
  script:
    # Pin Django first, so that installing the package keeps that version.
    - pip install "Django~=${DJANGO}.0"
    - pip install -e .
    - python runtests.py -v 2
