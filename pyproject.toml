[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-htmx-datatable"
dynamic = ["version"]
# version = "0.0.1"
description = "Searchable, sortable, filterable, paginated tables for Django models, rendered server-side with htmx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mario Orlandi" }]
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/morlandi/django-htmx-datatable"
# Repository = "https://gitlab.brainstorm.it/colorcraft/main/django-htmx-datatable"

[tool.setuptools.packages.find]
include = ["htmx_datatable*"]

[tool.setuptools.package-data]
htmx_datatable = ["templates/htmx_datatable/*.html"]

[tool.setuptools.dynamic]
version = { attr = "htmx_datatable.__version__" }
