[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-htmx-datatable"
dynamic = ["version"]
# version = "0.0.1"
description = "Searchable, sortable, filterable, paginated tables for Django models, rendered server-side with htmx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mario Orlandi" }]
requires-python = ">=3.8"
dependencies = [
    "Django>=4.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/morlandi/django-htmx-datatable"

[tool.setuptools.packages.find]
include = ["htmx_datatable*"]

[tool.setuptools.package-data]
htmx_datatable = ["templates/htmx_datatable/*.html", "locale/*/LC_MESSAGES/django.*"]

[tool.setuptools.dynamic]
version = { attr = "htmx_datatable.__version__" }
